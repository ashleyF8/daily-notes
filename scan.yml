name: daily

on:
  schedule:
    # Times are UTC. A run starts each hour on weekdays; while one is already
    # scanning, the next waits its turn and takes over when it finishes.
    # Each run scans every 90 seconds until the US session ends (or ~5.5 hours).
    - cron: "3 11-20 * * 1-5"
  workflow_dispatch:   # "Run workflow" button = one quick test scan

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Get the latest alert history
        run: git pull --ff-only || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Fix file names (spaces to underscores)
        run: |
          for f in *" "*; do [ -e "$f" ] && mv "$f" "${f// /_}"; done
          ls -la

      - name: Install
        run: pip install -r requirements.txt

      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ACCOUNT_GBP: ${{ secrets.ACCOUNT_GBP }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          LOOP_MINUTES: "330"
          SCAN_EVERY_SECONDS: "90"
        run: python scanner_alerts.py

      - name: Save alert history
        if: always()
        run: |
          if [ -f alerted.json ]; then
            git config user.name "bot"
            git config user.email "bot@users.noreply.github.com"
            git add alerted.json
            if ! git diff --cached --quiet; then
              git commit -m "update"
              git pull --rebase -X theirs || true
              git push || true
            fi
          fi
